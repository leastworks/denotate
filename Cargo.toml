[workspace]
members = [
    "crates/analysis",
    "crates/normalize",
    "crates/ir",
    "crates/ir-text",
    "crates/check",
    "crates/check-session",
    "crates/presentation",
    "crates/editor",
    "test-dsl",
    "den/lsp/server",
    "lsp-tests",
]
resolver = "2"

[workspace.dependencies]
salsa = "=0.28.5"
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.145"

[profile.release]
lto = "thin"
