[workspace]
members = [
    "crates/analysis",
    "crates/normalize",
    "crates/ir",
    "crates/ir-text",
    "crates/check",
    "crates/plan",
    "crates/check-session",
    "crates/presentation",
    "crates/editor",
    "crates/test-dsl",
    "crates/den-lsp",
    "crates/lsp-tests",
]
exclude = ["third_party"]
resolver = "2"

[workspace.dependencies]
salsa = "=0.28.5"
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.145"

[profile.release]
lto = "thin"

# Release code with line tables, for sampling profilers (`just profile-den`).
[profile.profiling]
inherits = "release"
debug = "line-tables-only"

# batsat 0.6.0 with one public setter for its internal budgets (third_party/batsat/PATCHES.md).
[patch.crates-io]
batsat = { path = "third_party/batsat" }
