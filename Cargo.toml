[workspace]
members = [
    "crates/analysis",
    "crates/normalize",
    "crates/ir",
    "crates/ir-text",
    "crates/check",
    "crates/check-session",
    "crates/presentation",
    "crates/editor",
    "crates/test-dsl",
    "crates/den-lsp",
    "crates/lsp-tests",
]
resolver = "2"

[workspace.dependencies]
salsa = "=0.28.5"
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.145"

[profile.release]
lto = "thin"

# Release code with line tables, for sampling profilers (`just profile-den`).
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
