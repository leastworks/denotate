name: Frontend prototype

on:
  push:
    paths: ['frontend-prototype/**', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['frontend-prototype/**', '.github/workflows/frontend.yml']

jobs:
  frontend-comparison:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-prototype/langium/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend-prototype/langium
      - name: Install native core toolchain
        run: rustup toolchain install 1.93.0 --profile minimal
      - name: Native analysis and timing unit tests
        run: cargo +1.93.0 test --manifest-path frontend-prototype/native/Cargo.toml --locked --workspace --exclude denotate-tree-sitter
      - name: Parser fixtures and inventory checks
        run: npm test --prefix frontend-prototype/langium
      - name: Install Rust toolchain
        run: rustup toolchain install 1.78.0 --profile minimal
      - name: InputMapping worker and diagnostics over LSP
        run: |
          cargo +1.93.0 build --manifest-path frontend-prototype/native/Cargo.toml --locked -p denotate-test-dsl --bin inputmapping-lsp
          DENOTATE_LSP_COMMAND="$GITHUB_WORKSPACE/frontend-prototype/native/target/debug/inputmapping-lsp" DENOTATE_LSP_ARGS='[]' cargo +1.78.0 test --manifest-path frontend-prototype/Cargo.toml --locked -p denotate-lsp-tests --features inputmapping --test inputmapping
      - name: Shared LSP acceptance tests
        run: cargo +1.78.0 test --manifest-path frontend-prototype/Cargo.toml --locked -p denotate-lsp-tests
      - name: Retained A1 LSP baseline
        env:
          DENOTATE_BACKEND: langium
        run: cargo +1.78.0 run --manifest-path frontend-prototype/Cargo.toml --locked -p xtask -- test-lsp
      - name: Test runner selection
        run: cargo +1.78.0 test --manifest-path frontend-prototype/Cargo.toml --locked -p xtask
      - name: Post-baseline shared scenarios in Langium-only mode
        env:
          DENOTATE_BACKEND: langium
        run: cargo +1.78.0 test --manifest-path frontend-prototype/Cargo.toml --locked -p denotate-lsp-tests --test acceptance --test lifecycle --test b1 --test b2 --test b4 --test zero_arity
      - name: Install B frontend dependencies
        run: npm ci --prefix frontend-prototype/tree-sitter
      - name: InputMapping generated parser is current
        run: |
          cd frontend-prototype/native/test-dsl/grammar
          ../../../tree-sitter/node_modules/.bin/tree-sitter generate
          test -z "$(git status --porcelain --untracked-files=all -- src)"
      - name: Tree-sitter syntax manifest and component tests
        run: npm test --prefix frontend-prototype/tree-sitter
      - name: B shared editor, lifecycle and extension scenarios
        run: npm run test:lsp --prefix frontend-prototype/tree-sitter
