name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # The runner's disk filled up while linking test binaries. Line tables keep
      # panic backtraces readable; incremental caches only help local rebuilds.
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: editors/den/package-lock.json
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.93.0 --profile minimal
      - name: Rust crates (IR, checker, sessions, presentation, editor, ir-text, test DSL)
        run: cargo +1.93.0 test --locked --workspace --exclude denotate-lsp --exclude denotate-lsp-tests
      - name: Scorecard correctness
        run: |
          cargo +1.93.0 test --locked -p denotate-check-session --features test-support --example score_den
          cargo +1.93.0 test --locked -p denotate-check-session --features test-support --example scorecard
      - name: Install .den editor dependencies
        run: npm ci --prefix editors/den
      - name: Shared .den generated parser is current
        run: |
          npm run generate --prefix editors/den -- --force
          test -z "$(git status --porcelain --untracked-files=all -- grammars/den/src)"
      - name: Test DSL generated parser is current
        run: |
          cd grammars/test-dsl
          ../../editors/den/node_modules/.bin/tree-sitter generate
          test -z "$(git status --porcelain --untracked-files=all -- src)"
      - name: .den editor syntax manifest and component tests
        run: npm test --prefix editors/den
      - name: .den editor LSP scenarios
        run: npm run test:lsp --prefix editors/den
      - name: Test DSL worker and diagnostics over LSP
        run: |
          cargo +1.93.0 build --locked -p denotate-test-dsl --bin test-dsl-lsp
          DENOTATE_LSP_COMMAND="$GITHUB_WORKSPACE/target/debug/test-dsl-lsp" DENOTATE_LSP_ARGS='[]' cargo +1.93.0 test --locked -p denotate-lsp-tests --features test-dsl --test test_dsl
      - name: Test DSL editor package and example
        run: |
          npm ci --prefix editors/test-dsl
          npm test --prefix editors/test-dsl
