name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: den/lsp/package-lock.json
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.93.0 --profile minimal
      - name: Native workspace (IR, checker, sessions, presentation, editor, ir-text, test DSL)
        run: cargo +1.93.0 test --locked --workspace --exclude denotate-lsp --exclude denotate-lsp-tests
      - name: Install .den editor dependencies
        run: npm ci --prefix den/lsp
      - name: Shared .den generated parser is current
        run: |
          npm run generate --prefix den/lsp
          test -z "$(git status --porcelain --untracked-files=all -- den/grammar/src)"
      - name: Test DSL generated parser is current
        run: |
          cd test-dsl/grammar
          ../../den/lsp/node_modules/.bin/tree-sitter generate
          test -z "$(git status --porcelain --untracked-files=all -- src)"
      - name: .den editor syntax manifest and component tests
        run: npm test --prefix den/lsp
      - name: .den editor LSP scenarios
        run: npm run test:lsp --prefix den/lsp
      - name: Test DSL worker and diagnostics over LSP
        run: |
          cargo +1.93.0 build --locked -p denotate-test-dsl --bin test-dsl-lsp
          DENOTATE_LSP_COMMAND="$GITHUB_WORKSPACE/target/debug/test-dsl-lsp" DENOTATE_LSP_ARGS='[]' cargo +1.93.0 test --locked -p denotate-lsp-tests --features test-dsl --test test_dsl
      - name: Test DSL editor package and example
        run: |
          npm ci --prefix test-dsl/vscode
          npm test --prefix test-dsl/vscode
