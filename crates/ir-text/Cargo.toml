[package]
name = "denotate-ir-text"
version = "0.0.1"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"
publish = false

[dependencies]
denotate-presentation = { path = "../presentation" }
denotate-analysis = { path = "../analysis" }
salsa.workspace = true
denotate-ir = { path = "../ir" }
denotate-check = { path = "../check" }
tree-sitter = "=0.25.10"
tree-sitter-language = "=0.1.5"
serde_json.workspace = true
sha2 = "=0.10.9"

[build-dependencies]
cc = "=1.5.1"

[dev-dependencies]
denotate-check = { path = "../check", features = ["test-support"] }
denotate-check-session = { path = "../check-session" }

[[example]]
name = "check"
test = true

[[example]]
name = "bench_schema"
test = true
