[package]
name = "denotate-check-session"
version = "0.0.1"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"
publish = false

[features]
test-support = ["denotate-check/test-support"]

[dependencies]
salsa.workspace = true
denotate-check = { path = "../check" }
denotate-ir = { path = "../ir" }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libc = "=0.2.189"

[dev-dependencies]
denotate-ir-text = { path = "../ir-text" }
denotate-check = { path = "../check", features = ["test-support"] }
denotate-test-dsl = { path = "../test-dsl" }
denotate-editor = { path = "../editor" }
denotate-normalize = { path = "../normalize" }

[[example]]
name = "scorecard"
required-features = ["test-support"]

[[example]]
name = "score_den"
required-features = ["test-support"]
