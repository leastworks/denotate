[workspace]
members = ["analysis", "normalize", "ir", "ir-text", "check", "check-session", "presentation", "editor", "../test-dsl", "../den/lsp/server"]
resolver = "2"

[workspace.dependencies]
salsa = "=0.28.5"
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.145"

[profile.release]
lto = "thin"
